[tox]
# the unit tests on every supported python; the tests on the k3d cluster are
# deselected by `addopts` (run them with `SIMRUN_K3D=1 uv run pytest -m cluster`),
# ruff and ty run in the environment of the project (`uv run ty check`)
envlist = py3.{14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
extras =
    dev
# the tests call uv (environments, editable installs) and git (snapshots), whose
# caches and configuration live in the home directory
passenv =
    HOME
    XDG_CACHE_HOME
    UV_CACHE_DIR
commands =
    pytest {posargs}
