# The run store: an NFS export (`store-settings.yaml`) mounted by csi-driver-nfs into
# the pods of the runs at `ClusterConfig.store_mount`; the data of the store is the
# directory `store` of the share, kept when the claim is deleted.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: simrun-nfs
provisioner: nfs.csi.k8s.io
parameters:
  server: SERVER
  share: SHARE
  subDir: store
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.2
  # negative lookups are not cached, so a file a pod wrote (e.g. the marker of a
  # merge) is seen at once by the service and the other pods; a PersistentVolume
  # provisioned before keeps the options it was created with
  - lookupcache=positive
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simrun-store
  namespace: simrun
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: simrun-nfs
  resources:
    requests:
      storage: 4Ti
