# the controller looks at a workflow again 2 s after a change of its pods instead of
# 10 s (`DEFAULT_REQUEUE_TIME`, docs/environment-variables.md of Argo), so a run and
# its tasks show running soon after their pods started
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-controller
spec:
  template:
    spec:
      containers:
        - name: workflow-controller
          env:
            - name: DEFAULT_REQUEUE_TIME
              value: 2s
