# Argo Workflows v4.1.6, the namespaced install (`namespace-install.yaml`, the release
# manifest, unchanged) in the namespace `simrun`, without an archive; the executor
# containers request what they limit, since Kueue counts every container of a pod;
# the service account of the workflows (`ClusterConfig.service_account`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simrun
resources:
  - namespace-install.yaml
  - workflow-rbac.yaml
patches:
  - path: controller-config.yaml
