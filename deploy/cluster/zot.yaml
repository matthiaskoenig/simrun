# The image registry inside the network (`SIMRUN_REGISTRY`): Zot, its images on a
# local volume, reached by the nodes on port 5000 (each node names it in
# /etc/rancher/k3s/registries.yaml) and by the service and BuildKit through the
# Service `zot`; `registry.cluster.internal:5000` stands for its address.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: simrun
data:
  config.json: |
    {
      "storage": {"rootDirectory": "/var/lib/registry", "gc": true, "dedupe": true},
      "http": {"address": "0.0.0.0", "port": "5000"},
      "log": {"level": "info"}
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-data
  namespace: simrun
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: simrun
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      affinity:
        # off the nodes of the runs, whose resources Kueue and the planner count
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: simrun/worker
                    operator: DoesNotExist
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.23
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - containerPort: 5000
              name: registry
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/zot
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: config
          configMap:
            name: zot-config
        - name: data
          persistentVolumeClaim:
            claimName: zot-data
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: simrun
spec:
  type: LoadBalancer
  selector:
    app: zot
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
