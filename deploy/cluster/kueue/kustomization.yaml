# Kueue v0.20.5 (`manifests.yaml`, the release manifest, unchanged) with the
# integration of plain pods for the namespace `simrun`, and the queues of simrun.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests.yaml
  - queues.yaml
patches:
  - path: config.yaml
