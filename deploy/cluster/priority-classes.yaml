# The priorities of the pods of simrun, `simrun.planner.PRIORITY_VALUES`: a Kueue
# WorkloadPriorityClass (admission and preemption by Kueue) and a Kubernetes
# PriorityClass of the same name and value (the order of the pods on a node).
# The scheduler never preempts (`preemptionPolicy: Never`), Kueue does.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: simrun-owner-base
value: 1000
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: simrun-owner-base
value: 1000
preemptionPolicy: Never
globalDefault: false
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: simrun-owner-extra
value: 900
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: simrun-owner-extra
value: 900
preemptionPolicy: Never
globalDefault: false
---
apiVersion: kueue.x-k8s.io/v1beta2
