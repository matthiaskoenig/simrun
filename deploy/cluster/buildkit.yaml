# BuildKit, rootless: the images of the environments of the runs are built by a Job
# of the service (`ArgoBackend.build_image`) whose `buildctl` sends the build context
# to this daemon and pushes the image to the registry, with the credentials of the
# optional Secret `simrun-registry-auth` (a docker `config.json`). Its state, the
# layers and the cache of uv of the builds, is a volume which outlives the pod, so a
# build after a restart reuses them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: simrun
data:
  buildkitd.toml: |
    [registry."registry.cluster.internal:5000"]
      http = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: simrun
spec:
  replicas: 1
  # the state is a volume of one node, which one pod at a time mounts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      affinity:
        # off the nodes of the runs, whose resources Kueue and the planner count
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: simrun/worker
                    operator: DoesNotExist
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.34.2-rootless
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            - --config
            - /etc/buildkit/buildkitd.toml
          ports:
            - containerPort: 1234
              name: buildkitd
          readinessProbe:
            exec:
              command: ["buildctl", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: config
              mountPath: /etc/buildkit
            - name: state
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: config
          configMap:
            name: buildkitd-config
        - name: state
          persistentVolumeClaim:
            claimName: buildkitd-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkitd-state
  namespace: simrun
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: simrun
spec:
  selector:
    app: buildkitd
  ports:
    - name: buildkitd
      port: 1234
      targetPort: 1234
