apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: simrun
data:
  buildkitd.toml: |
    [registry."k3d-simrun-registry:5000"]
      http = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: simrun
spec:
  template:
    spec:
      containers:
        - name: buildkitd
          # on the server node, which has the cores and the memory of the host: the
          # bytecode of an environment compiles in parallel
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi
