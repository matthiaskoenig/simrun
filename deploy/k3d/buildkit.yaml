apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: simrun
data:
  buildkitd.toml: |
    [registry."k3d-simrun-registry:5000"]
      http = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: simrun
spec:
  template:
    spec:
      containers:
        - name: buildkitd
          # on the server node with the controllers: it requests one core, which
          # a runner of continuous integration (four cores) leaves the others,
          # and may use four of a larger host, where the bytecode of an
          # environment compiles in parallel
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
