name: cluster

# The tests on a k3d cluster (`tests/cluster`): k3s with Kueue, Argo Workflows,
# BuildKit and a registry in docker, the service in the process of the tests.
# They take half an hour and are not part of the required checks: the job
# `cluster` of CI-CD calls this workflow on a push to develop, on a release,
# which waits for it, and when CI-CD is started by hand; a pull request runs it
# when it has the label `cluster`, once the label is added and with every push
# after it.

on:
  workflow_call:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  cluster:
    name: cluster
    # a pull request without the label skips the job; adding another label to
    # a pull request with the label does not run it again
    if: >-
      ${{ github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'cluster')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'cluster')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      # a newer push to a pull request supersedes its running cluster tests;
      # a push to develop and a release are groups of their own
      group: cluster-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Free the disk for the images
      # the tests need about 20 GiB for the images of k3s, Kueue, Argo,
      # BuildKit, the runs and the environments (`MIN_FREE_GB` of
      # tests/cluster/k3d_cluster.py); the toolchains of the runner image
      # which the tests do not use take more than that
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
        docker system prune --all --force
        df -h /
    - name: Set up the environment
      uses: ./.github/actions/setup
      with:
        python-version: "3.14"
        sync: --extra dev
    - name: Set up node
      # the image of the service has the web app, built in frontend/
      # (`build_service_image` of tests/cluster/k3d_cluster.py)
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Test on the k3d cluster
      # the session downloads k3d and kubectl into .tools/bin and creates the
      # cluster; the cluster is kept (`SIMRUN_K3D_KEEP=1`), the runner is
      # thrown away, so the next step can describe it after a failure
      env:
        SIMRUN_K3D: "1"
        SIMRUN_K3D_KEEP: "1"
      run: uv run --no-sync pytest -m cluster tests/cluster --durations=0
    - name: Describe the cluster after a failure
      if: failure()
      env:
        KUBECONFIG: .tools/kubeconfig
      run: |
        kubectl=.tools/bin/kubectl
        $kubectl get nodes -o wide || true
        $kubectl get pods --all-namespaces -o wide || true
        $kubectl get workflows,workloads --namespace simrun || true
        $kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -n 200 || true
        df -h / || true
