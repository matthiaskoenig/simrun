# Keep the GitHub Actions used in the workflows and the locked python dependencies up to date,
# monthly, since every update pull request runs the checks.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # a single pull request for all action updates instead of one per action
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # the locked python dependencies (uv.lock), bumped together
  - package-ecosystem: "uv"
    directory: "/"
    # only uv.lock is updated: the default would raise the lower bounds in
    # pyproject.toml, which are what a user of the library installs against,
    # so they are only ever changed by hand
    versioning-strategy: lockfile-only
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"

  # the locked npm dependencies of the web app (frontend/package-lock.json), bumped together
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    ignore:
      # vue-tsc and openapi-typescript need the API of the compiler in
      # javascript, which TypeScript 7 (the native port) does not have
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # the types of node follow the node of continuous integration (24)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
