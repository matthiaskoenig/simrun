repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: detect-private-key
  - id: debug-statements

- repo: https://github.com/astral-sh/ruff-pre-commit
  # the locked version in uv.lock, raise it when the lock moves
  rev: v0.17.4
  hooks:
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    - id: ruff-format
      types_or: [ python, pyi ]

- repo: https://github.com/astral-sh/ty-pre-commit
  rev: v0.0.98
  hooks:
    - id: ty
      args: [ --extra, dev ]
