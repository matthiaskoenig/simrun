[tool.bumpversion]
current_version = "0.3.1"
commit = true
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
# no tag: the bump is merged into develop through a pull request, which
# rewrites the commit, so the tag is created on develop afterwards
tag = false
sign_tags = false
tag_name = "{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "./src/simrun/__init__.py"

[[tool.bumpversion.files]]
filename = "./CITATION.cff"

# the image of the service and the wheel it carries, in its manifest, its Dockerfile
# and the documentation of the deployment (`tests/test_version.py`)
[[tool.bumpversion.files]]
filename = "./deploy/cluster/simrun.yaml"
search = "simrun-service:{current_version}"
replace = "simrun-service:{new_version}"

[[tool.bumpversion.files]]
filename = "./deploy/cluster/simrun.yaml"
search = "simrun-{current_version}-py3-none-any.whl"
replace = "simrun-{new_version}-py3-none-any.whl"

[[tool.bumpversion.files]]
filename = "./deploy/service/Dockerfile"
search = "simrun-{current_version}-py3-none-any.whl"
replace = "simrun-{new_version}-py3-none-any.whl"

[[tool.bumpversion.files]]
filename = "./docs/deployment.md"
search = "simrun-service:{current_version}"
replace = "simrun-service:{new_version}"

[[tool.bumpversion.files]]
filename = "./docs/deployment.md"
search = "simrun-{current_version}-py3-none-any.whl"
replace = "simrun-{new_version}-py3-none-any.whl"
