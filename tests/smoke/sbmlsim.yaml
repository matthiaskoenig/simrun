# The analyses of the HCTZ example of sbmlsim (`examples.hctz_fitting.project`),
# small enough to run in minutes: every kind which the example has, through simrun.
# Run with `tests/smoke/run.py`, see "Smoke workflows" in docs/testing.md.
name: smoke-sbmlsim
tasks:
  - id: simulate
    type: sbmlsim.simulate
    settings:
      project: examples.hctz_fitting.project:PROJECT
  - id: fit
    type: sbmlsim.fit
    settings:
      project: examples.hctz_fitting.project:PROJECT
      subset: PK
      repeats: 4
  - id: identifiability
    type: sbmlsim.identifiability
    settings:
      project: examples.hctz_fitting.project:PROJECT
      subset: PK
      max_points: 10
    inputs:
      fit: fit.out
  - id: fisher
    type: sbmlsim.fisher
    settings:
      project: examples.hctz_fitting.project:PROJECT
      subset: PK
    inputs:
      fit: fit.out
  - id: report
    type: sbmlsim.report
    settings:
      project: examples.hctz_fitting.project:PROJECT
      subset: PK
    inputs:
      fit: identifiability.out
  - id: petab
    type: sbmlsim.petab
    settings:
      project: examples.hctz_fitting.project:PROJECT
      subset: PK
    inputs:
      fit: fit.out
  - id: scan
    type: sbmlsim.scan
    settings:
      project: examples.hctz_fitting.project:PROJECT
      analysis: dose
  - id: sensitivity
    type: sbmlsim.sensitivity
    settings:
      project: examples.hctz_fitting.project:PROJECT
      analysis: sobol
  - id: uncertainty
    type: sbmlsim.uncertainty
    settings:
      project: examples.hctz_fitting.project:PROJECT
      analysis: cl
