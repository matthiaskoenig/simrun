# Same as Black.
line-length = 88
indent-width = 4

# oldest supported version, see `project.requires-python`
target-version = "py314"

[lint]
# Pyflakes (`F`) and a subset of pycodestyle (`E`), plus:
#   W    pycodestyle warnings
#   I    import sorting
#   D    docstrings (google convention, see [lint.pydocstyle])
#   UP   pyupgrade, keeps the code on current python syntax
#   B    bugbear, likely bugs and design problems
#   C4   comprehensions
#   SIM  simplifications
#   RET  return statements
#   G    logging format, lazy `%s` instead of f-strings
#   PIE  misc lints
#   RUF  ruff specific rules
select = [
    "E4", "E7", "E9", "F", "W", "I", "D", "UP", "B", "C4", "SIM", "RET", "G", "PIE", "RUF",
]
ignore = [
    # names such as `König` are not ambiguous unicode, they are german
    "RUF001",
    "RUF002",
    "RUF003",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# the tests are fixtures and checks, a docstring on every helper adds nothing
"tests/**" = ["D"]

[lint.pydocstyle]
convention = "google"  # Accepts: "google", "numpy", or "pep257".

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
